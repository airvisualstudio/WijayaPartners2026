aboutSubheading: >-
  Established in 1988, Wijaya & Partners has served as a dedicated legal guardian from
  our base in Bandung, Indonesia. Over the past three decades, we have built a reputation
  for sophisticated commercial litigation, corporate advisory, and dispute resolution.
  We blend a deep understanding of local laws, customs, and regulatory frameworks
  with international professional standards.
